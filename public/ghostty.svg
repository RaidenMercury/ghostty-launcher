<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="ghostGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="spectralShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="64" cy="64" r="58" fill="url(#ghostGlow)"/>

  <!-- Ghost Body -->
  <g filter="url(#spectralShadow)">
    <path d="M 32 64 C 32 38 42 22 64 22 C 86 22 96 38 96 64 C 96 86 96 98 96 98 L 84 90 L 72 98 L 64 90 L 56 98 L 44 90 L 32 98 Z" 
          fill="url(#bodyGrad)"/>
    
    <!-- Ghost Face / Eyes (Minecraft pixelated rounded slits) -->
    <rect x="46" y="48" width="8" height="14" rx="3" fill="#0f172a"/>
    <rect x="74" y="48" width="8" height="14" rx="3" fill="#0f172a"/>

    <!-- Eye Highlights (Cyan glow) -->
    <rect x="48" y="50" width="4" height="4" rx="1" fill="#38bdf8"/>
    <rect x="76" y="50" width="4" height="4" rx="1" fill="#38bdf8"/>

    <!-- Cute little blush / spectral cheek marks -->
    <circle cx="42" cy="66" r="3.5" fill="#f43f5e" fill-opacity="0.35"/>
    <circle cx="86" cy="66" r="3.5" fill="#f43f5e" fill-opacity="0.35"/>

    <!-- Floating Mini Minecraft Grass Cube floating next to ghost -->
    <g transform="translate(86, 26) scale(0.7)">
      <!-- Top face -->
      <polygon points="12,2 22,7 12,12 2,7" fill="#22c55e"/>
      <!-- Right face -->
      <polygon points="22,7 22,17 12,22 12,12" fill="#78350f"/>
      <!-- Left face -->
      <polygon points="2,7 12,12 12,22 2,17" fill="#92400e"/>
      <!-- Grass layer side trim -->
      <polygon points="2,7 12,12 12,14 2,9" fill="#16a34a"/>
      <polygon points="22,7 12,12 12,14 22,9" fill="#15803d"/>
    </g>
  </g>
</svg>
