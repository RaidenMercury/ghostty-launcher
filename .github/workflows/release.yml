name: Multi-Platform Release (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb,rpm'
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ghostty Launcher ${{ github.ref_name }}'
          releaseBody: |
            Ghostty Launcher v0.1.0 — Lanzador independiente y suite de modding con diseño VisionOS Glass para Minecraft.
            
            ### Paquetes disponibles en esta versión:
            - **Linux:** `.AppImage`, `.deb` (Debian/Ubuntu) y `.rpm` (Fedora/RHEL/openSUSE)
            - **Windows:** Instalador `.exe` (NSIS)
            - **macOS:** Imagen de disco `.dmg`
            
            ---
            
            > **Nota sobre la autenticación de Microsoft / Xbox Live:**  
            > De forma temporal, el inicio de sesión OAuth utiliza el identificador de cliente comunitario verificado por Mojang (`c36a9fb6`) mientras la aplicación oficial registrada en Azure para **Ghostty Launcher** (`1b857661-eaf1-4c25-a00f-be80204fb059`) completa las revisiones de Mojang Studios en [aka.ms/AppRegInfo](https://aka.ms/AppRegInfo). En cuanto sea aprobada en la lista blanca de la API, se activará de forma nativa sin requerir intervención del usuario.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

