name: Multi-Platform Release (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb,rpm'
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ghostty Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## Ghostty Launcher ${{ github.ref_name }} — Release Notes

            Esta versión v0.1.2 implementa el endurecimiento de seguridad integral del launcher, mitigando vectores de ejecución de comandos en Windows, previniendo path traversal en el manejo de contenido e instancias, y blindando la subida de paquetes temporales.

            ### Resumen de Correcciones y Soluciones

            * **Seguridad en Apertura de URLs Externas (Windows):**
              - Mitigación de inyección de comandos en `open_external_url` en Windows: sustitución de `cmd.exe /C start` por invocación directa vía `rundll32 url.dll,FileProtocolHandler`, evitando la ruptura o inyección provocada por caracteres de control (`&`, `|`, newlines) en URLs con parámetros de búsqueda.

            * **Protección contra Path Traversal en Gestor de Contenido:**
              - Saneamiento y validación estricta de nombres de archivo en `delete_content` y `toggle_content` mediante `safe_content_path`, impidiendo secuencias de escape de directorio (`../`) y asegurando que las operaciones se limiten estrictamente a la carpeta de mods/paquetes.

            * **Blindaje de Archivos Temporales de Subida:**
              - Validación estricta en `append_upload_chunk` y `finish_upload` mediante `validate_cache_temp_path`, restringiendo la escritura exclusivamente a archivos generados con prefijo `upload_` dentro de la carpeta `caches/` del launcher.

            * **Aislamiento y Validación de Identificadores de Instancia:**
              - Validación de formato para `instance_id` (`is_valid_instance_id`) y verificación de confinamiento en `get_instance_dir` y `delete_instance`, garantizando que ninguna llamada pueda escapar del directorio raíz de instancias.

            ---

            ### Paquetes y Extensiones Disponibles en este Release:
            - **Linux:** `.AppImage` (Universal ejecutable portable), `.deb` (Debian, Ubuntu, Mint) y `.rpm` (Fedora, RHEL, openSUSE).
            - **Windows:** Instalador `.exe` (NSIS) de 64 bits.
            - **macOS:** Imagen de disco `.dmg` (Universal para procesadores Intel y Apple Silicon).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

