name: Multi-Platform Release (Linux, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb,rpm'
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libxdo-dev

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ghostty Launcher ${{ github.ref_name }}'
          releaseBody: |
            ## Ghostty Launcher ${{ github.ref_name }} — Release Notes

            Esta versión v0.1.1 incluye correcciones en la experiencia de usuario, optimizaciones de rendimiento y nuevas funcionalidades desarrolladas entre v0.1.0 y v0.1.1.

            ### Resumen de Correcciones y Soluciones (con Commits)

            * **Visor de Fotos In-Launcher (Lightbox):**
              - `8c7f680` — **feat(viewer):** Implementación de arquitectura de doble capa con desenfoque `.island-backdrop` (`backdrop-filter: blur(14px) saturate(1.05)`) y cierre instantáneo al hacer clic en cualquier espacio vacío exterior.
              - `1a4e7df` — **fix(viewer):** Corrección de montaje en `createPortal` con `AnimatePresence` interno para garantizar transiciones fluidas de entrada y salida con Framer Motion sin parpadeos.
              - `af641a3` — **fix(viewer):** Corrección del tamaño de miniaturas del carrusel (`w-20 h-14` / `w-24 h-16`) y auto-centrado geométrico suave sobre la imagen seleccionada.
              - `4a3434d` — **feat(ui):** Integración inicial del visor de capturas in-launcher para modpacks, mods, shaders y resourcepacks en lugar de abrir el navegador externo.

            * **Ajustes y Configuración:**
              - `d05be50` — **fix(settings):** Cierre automático del panel de Ajustes al presionar "Guardar Cambios" e inclusión del botón táctil de cierre rápido X.

            * **Internacionalización y Textos:**
              - `60797e4` — **feat(i18n):** Cobertura del 100% de traducción en Español e Inglés en todas las pantallas, configuraciones de entorno, botones y diálogos modales.

            * **Escalado Responsivo de Interfaz:**
              - `4d0c418` — **feat(ui):** Implementación de escalado dinámico (`--ui-scale`: Auto, 75%, 85%, 100%, 115%) para pantallas pequeñas (Steam Deck, 720p) y monitores de alta resolución.

            * **Autenticación y Rendimiento de Instancias:**
              - `ed21e61` — **fix(auth & perf):** Activación del Client ID oficial y aprobado de Ghostty Launcher en Microsoft Entra ID, junto con optimización del arrastre en el reordenamiento de instancias para eliminar retardo visual.

            * **Gestor de Contenido y Drag & Drop:**
              - `2c5b82f` — **feat(content):** Soporte de arrastrar y soltar archivos `.jar` (mods) y `.zip` (shaders / texturepacks) para instalación directa en la instancia activa, junto con resolución de dependencias de Modrinth.

            ---

            ### Paquetes y Extensiones Disponibles en este Release:
            - **Linux:** `.AppImage` (Universal ejecutable portable), `.deb` (Debian, Ubuntu, Mint) y `.rpm` (Fedora, RHEL, openSUSE).
            - **Windows:** Instalador `.exe` (NSIS) de 64 bits.
            - **macOS:** Imagen de disco `.dmg` (Universal para procesadores Intel y Apple Silicon).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

